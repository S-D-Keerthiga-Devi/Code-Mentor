<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Glass & Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <!-- AI Sparkle Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Code Bracket Left < -->
  <path d="M 44 42 L 26 64 L 44 86" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Bracket Right > -->
  <path d="M 84 42 L 102 64 L 84 86" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Slash / -->
  <path d="M 69 36 L 57 92" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" />

  <!-- AI Sparkle Star ✦ Top-Right -->
  <path d="M 96 22 C 96 30 102 36 110 36 C 102 36 96 42 96 50 C 96 42 90 36 82 36 C 90 36 96 30 96 22 Z" fill="url(#sparkGrad)" />
</svg>
